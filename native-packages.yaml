# Shared CLI: gem install native-packages --version 0.11.0
---
schema: 1
tool:
  version: 0.11.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the t64 package names; older releases the
# plain ones. Sound goes to PipeWire itself, else PulseAudio, else ALSA.
libraries:
  libasound.so.2:
    deb: libasound2t64 | libasound2
  libpipewire-0.3.so.0:
    deb: libpipewire-0.3-0t64 | libpipewire-0.3-0
nfpm:
  name: kuzgun
  maintainer: Carmine Paolino <carmine@paolino.me>
  homepage: https://github.com/kaptanoguz/Kuzgun
  description: Fast native WhatsApp client
  license: MIT
  provides: [fastsapp]
  conflicts: [fastsapp]
  replaces: [fastsapp]
  contents:
  - src: "@PAYLOAD@/kuzgun-v@VERSION@-@TARGET@/kuzgun"
    dst: "/usr/bin/kuzgun"
    file_info:
      mode: 493
  - src: LICENSE
    dst: /usr/share/licenses/kuzgun/LICENSE
    file_info:
      mode: 420
  - src: README.md
    dst: /usr/share/doc/kuzgun/README.md
    file_info:
      mode: 420
  - src: THIRD-PARTY-NOTICES.md
    dst: /usr/share/licenses/kuzgun/THIRD-PARTY-NOTICES.md
    file_info:
      mode: 420
  - src: packaging/applications/io.github.kaptanoguz.Kuzgun.desktop
    dst: /usr/share/applications/io.github.kaptanoguz.Kuzgun.desktop
    file_info:
      mode: 420
  - src: packaging/metainfo/io.github.kaptanoguz.Kuzgun.metainfo.xml
    dst: /usr/share/metainfo/io.github.kaptanoguz.Kuzgun.metainfo.xml
    file_info:
      mode: 420
  - src: packaging/icons/kuzgun.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.kaptanoguz.Kuzgun.svg
    file_info:
      mode: 420
  - src: packaging/icons/kuzgun-symbolic.svg
    dst: /usr/share/icons/hicolor/symbolic/apps/io.github.kaptanoguz.Kuzgun-symbolic.svg
    file_info:
      mode: 420
  - src: packaging/icons/hicolor/16x16/apps/io.github.kaptanoguz.Kuzgun.png
    dst: /usr/share/icons/hicolor/16x16/apps/io.github.kaptanoguz.Kuzgun.png
    file_info:
      mode: 420
  - src: packaging/icons/hicolor/22x22/apps/io.github.kaptanoguz.Kuzgun.png
    dst: /usr/share/icons/hicolor/22x22/apps/io.github.kaptanoguz.Kuzgun.png
    file_info:
      mode: 420
  - src: packaging/icons/hicolor/24x24/apps/io.github.kaptanoguz.Kuzgun.png
    dst: /usr/share/icons/hicolor/24x24/apps/io.github.kaptanoguz.Kuzgun.png
    file_info:
      mode: 420
  - src: packaging/icons/hicolor/32x32/apps/io.github.kaptanoguz.Kuzgun.png
    dst: /usr/share/icons/hicolor/32x32/apps/io.github.kaptanoguz.Kuzgun.png
    file_info:
      mode: 420
  - src: packaging/icons/hicolor/48x48/apps/io.github.kaptanoguz.Kuzgun.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.kaptanoguz.Kuzgun.png
    file_info:
      mode: 420
  - src: packaging/icons/hicolor/64x64/apps/io.github.kaptanoguz.Kuzgun.png
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.kaptanoguz.Kuzgun.png
    file_info:
      mode: 420
  - src: packaging/icons/hicolor/128x128/apps/io.github.kaptanoguz.Kuzgun.png
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.kaptanoguz.Kuzgun.png
    file_info:
      mode: 420
  - src: packaging/icons/hicolor/256x256/apps/io.github.kaptanoguz.Kuzgun.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.kaptanoguz.Kuzgun.png
    file_info:
      mode: 420
  - src: packaging/icons/hicolor/512x512/apps/io.github.kaptanoguz.Kuzgun.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.kaptanoguz.Kuzgun.png
    file_info:
      mode: 420
  - src: contrib/omarchy/kuzgun.json.tpl
    dst: /usr/share/kuzgun/omarchy/kuzgun.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/kuzgun-theme
    dst: /usr/share/kuzgun/omarchy/kuzgun-theme
    file_info:
      mode: 493
  # native-packages adds the C library (libc6, glibc) at the version the
  # binary needs: 2.36, as the release builds run in Debian 12.
  overrides:
    deb:
      depends:
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64 | libasound2
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libgcc-s1
      - libstdc++6
# Windows code and installers are signed through Azure Artifact Signing as
# PlentyLabs when the windows-signing environment provides the account
# (PACKAGING.md, "Windows signing").
windows:
  signing:
    provider: azure-artifact-signing
    description: Kuzgun
    publisher: PlentyLabs UG (haftungsbeschränkt) & Co. KG
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'kuzgun-@TAG@-macos-universal.dmg'
  windows-amd64:
    platform: windows
    arch: amd64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-x86_64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'kuzgun-@TAG@-x86_64-pc-windows-msvc.msi'
  windows-arm64:
    platform: windows
    arch: arm64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-aarch64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'kuzgun-@TAG@-aarch64-pc-windows-msvc.msi'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    input:
      local: dist/kuzgun-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: kuzgun-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    input:
      local: dist/kuzgun-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: kuzgun-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: kaptanoguz/Kuzgun
  checksums: checksums.txt
  prereleases: true
assets:
  AMD64:
    file: kuzgun-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/kuzgun-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: kuzgun-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/kuzgun-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: kuzgun-v@VERSION@-macos-universal.dmg
    local: dist/kuzgun-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: kuzgun-@VERSION@.tar.gz
    url: https://github.com/kaptanoguz/Kuzgun/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/kuzgun-@VERSION@.tar.gz
templates:
  homebrew/kuzgun.rb: packaging/homebrew/kuzgun.rb.in
repositories:
  homebrew:
    url: https://github.com/crmne/homebrew-tap.git
    push_url: https://github.com/crmne/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/kuzgun.rb: Casks/kuzgun.rb
    version_file: Casks/kuzgun.rb
    version_pattern: 'version "([^"]+)"'
    publish: push
version_file: Cargo.toml
