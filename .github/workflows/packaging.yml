name: Packaging

on:
  push:
    branches: [main, master]
    paths: [native-packages.yaml, packaging/**, contrib/omarchy/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  pull_request:
    paths: [native-packages.yaml, packaging/**, contrib/omarchy/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Published version (empty builds a stand-in .deb from this checkout)
        type: string
        default: ''
      publish:
        description: Attach packages and run enabled downstream publishers
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        type: boolean
        default: true
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: false
      HOMEBREW_TAP_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  packaging:
    name: Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native-packages
        run: gem install native-packages --version 0.11.0 --no-document
      - name: Validate configuration
        run: native-packages validate
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools binutils xz-utils gcc gcc-aarch64-linux-gnu
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Package the published release
        if: env.VERSION != ''
        run: |
          native-packages build --release "$VERSION" \
            --target linux-amd64 --target linux-arm64 \
            --output dist/native-packages
      - name: Package a stand-in binary
        if: env.VERSION == ''
        run: |
          cat > /tmp/kuzgun-stub.c <<'EOF'
          #include <stdio.h>
          int main(void) {
            puts("kuzgun 0.0.1");
            return 0;
          }
          EOF
          gcc -O2 -o /tmp/kuzgun-amd64 /tmp/kuzgun-stub.c
          aarch64-linux-gnu-gcc -O2 -o /tmp/kuzgun-arm64 /tmp/kuzgun-stub.c
          for pair in "x86_64-unknown-linux-gnu:/tmp/kuzgun-amd64" "aarch64-unknown-linux-gnu:/tmp/kuzgun-arm64"; do
            target="${pair%%:*}"
            binary="${pair#*:}"
            name="kuzgun-v0.0.1-$target"
            mkdir -p "dist/$name"
            cp "$binary" "dist/$name/kuzgun"
            chmod +x "dist/$name/kuzgun"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          native-packages build --version 0.0.1 \
            --target linux-amd64 --target linux-arm64 \
            --defer-recipes --output dist/native-packages
      - name: Attach the .deb packages to the GitHub release
        if: inputs.publish == true && env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          native-packages publish --from dist/native-packages --to github \
            --target linux-amd64 --target linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: native-packages
          path: dist/native-packages/
          include-hidden-files: true
          if-no-files-found: error

  # The Windows package, installed for real with stand-in program files: an
  # Inno Setup install as 0.20.1 and earlier made, the MSI taking it over, an
  # update, and uninstalling with Kuzgun running and without. Releases ship
  # only the MSI; the Inno script stays to make the old install to take over.
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install, update and remove
        shell: pwsh
        run: pwsh packaging/windows/test-installer.ps1
      # The release's own path to the package: native-packages checks the
      # input's executable is an x64 PE file, so a system one stands in.
      - name: Package as the release does
        shell: pwsh
        run: |
          gem install native-packages --version 0.11.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = "dist\windows-input-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "$env:SystemRoot\System32\PING.EXE" "$payload\kuzgun.exe"
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md, packaging\windows\kuzgun-installer.txt $payload
          native-packages build --version 0.0.1 --target windows-amd64 `
            --defer-recipes --output "$env:RUNNER_TEMP\windows-packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$env:RUNNER_TEMP\windows-packages\packages\windows-amd64\msi\kuzgun-v0.0.1-x86_64-pc-windows-msvc.msi"

  installation:
    name: Install (${{ matrix.os }}, ${{ matrix.image }})
    needs: packaging
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        # Debian and Ubuntu only: Linux ships a .deb.
        image: ${{ fromJSON(inputs.version && '["debian:12-slim", "ubuntu:24.04", "debian:13-slim"]' || '["ubuntu:24.04", "debian:13-slim"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: native-packages
          path: dist/native-packages
      - name: Install and check runtime libraries in a clean container
        env:
          IMAGE: ${{ matrix.image }}
        run: bash packaging/test-install.sh "$IMAGE" dist/native-packages

  user-installer:
    name: User installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install a source build into a prefix with spaces and a percent
        run: bash packaging/test-install-user.sh
