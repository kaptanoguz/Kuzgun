# The release workflow's Flatpak: the binary the Linux job built, packaged
# into the same sandbox as io.github.kaptanoguz.Kuzgun.yml describes. The
# job unpacks the release tarball into built/ beside this file first.
id: io.github.kaptanoguz.Kuzgun
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: kuzgun
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --socket=pulseaudio
  - --share=network
  # Archive encryption key.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications, which Fastframe sends straight to the server.
  - --talk-name=org.freedesktop.Notifications
  - --persist=.local/state
modules:
  - name: kuzgun
    buildsystem: simple
    build-commands:
      - install -Dm755 kuzgun /app/bin/kuzgun
      - install -Dm644 packaging/applications/*.desktop /app/share/applications/io.github.kaptanoguz.Kuzgun.desktop
      - sed -i 's/^Icon=.*$/Icon=io.github.kaptanoguz.Kuzgun/;s/^StartupWMClass=kuzgun$/StartupWMClass=io.github.kaptanoguz.Kuzgun/' /app/share/applications/io.github.kaptanoguz.Kuzgun.desktop
      - install -Dm644 packaging/icons/kuzgun.svg /app/share/icons/hicolor/scalable/apps/io.github.kaptanoguz.Kuzgun.svg
      - install -Dm644 packaging/flatpak/io.github.kaptanoguz.Kuzgun.metainfo.xml /app/share/metainfo/io.github.kaptanoguz.Kuzgun.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/kuzgun/LICENSE
    sources:
      - type: dir
        path: built
      # Metainfo belongs to this packaging checkout, not the portable archive.
      - type: file
        path: io.github.kaptanoguz.Kuzgun.metainfo.xml
        dest: packaging/flatpak
